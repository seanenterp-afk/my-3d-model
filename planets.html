<style>
  .planets-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: 100%;
  }

  .planet-wrap {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 1;
  }

  .planet-canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
    position: relative;
    z-index: 1;
  }

  .planet-canvas:active { cursor: grabbing; }

  .stars {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: radial-gradient(ellipse at center, #0d1b2a 0%, #000005 100%);
  }

  .stars::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, #fff 100%, transparent),
      radial-gradient(1px 1px at 25% 60%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 40% 30%, #fff 100%, transparent),
      radial-gradient(1px 1px at 55% 75%, #fff 100%, transparent),
      radial-gradient(1px 1px at 70% 10%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 80% 50%, #fff 100%, transparent),
      radial-gradient(1px 1px at 90% 85%, #fff 100%, transparent),
      radial-gradient(1px 1px at 15% 90%, #fff 100%, transparent),
      radial-gradient(1px 1px at 35% 45%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 60% 20%, #fff 100%, transparent),
      radial-gradient(1px 1px at 75% 65%, #fff 100%, transparent),
      radial-gradient(1px 1px at 5%  40%, #fff 100%, transparent),
      radial-gradient(1px 1px at 48% 88%, #fff 100%, transparent),
      radial-gradient(1px 1px at 92% 30%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 20% 5%,  #fff 100%, transparent),
      radial-gradient(1px 1px at 65% 95%, #fff 100%, transparent),
      radial-gradient(1px 1px at 83% 78%, #fff 100%, transparent),
      radial-gradient(1px 1px at 3%  70%, #fff 100%, transparent),
      radial-gradient(1px 1px at 44% 12%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 57% 55%, #fff 100%, transparent);
    opacity: 0.85;
  }

  .stars::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 8%  22%, #aad4ff 100%, transparent),
      radial-gradient(1px 1px at 30% 80%, #aad4ff 100%, transparent),
      radial-gradient(1px 1px at 52% 48%, #ffd6aa 100%, transparent),
      radial-gradient(1px 1px at 68% 35%, #aad4ff 100%, transparent),
      radial-gradient(1px 1px at 85% 92%, #aad4ff 100%, transparent),
      radial-gradient(1px 1px at 18% 58%, #ffd6aa 100%, transparent),
      radial-gradient(1px 1px at 77% 18%, #aad4ff 100%, transparent),
      radial-gradient(1px 1px at 42% 72%, #aad4ff 100%, transparent),
      radial-gradient(1px 1px at 95% 55%, #ffd6aa 100%, transparent),
      radial-gradient(1px 1px at 23% 33%, #aad4ff 100%, transparent);
    opacity: 0.6;
    animation: twinkle 4s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0%   { opacity: 0.4; }
    100% { opacity: 0.9; }
  }

  .glow-ring {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    border-radius: 16px;
    box-shadow:
      inset 0 0 40px rgba(255,255,255,0.04),
      0 0 30px rgba(255,255,255,0.12),
      0 0 60px rgba(180,210,255,0.1),
      0 0 90px rgba(180,210,255,0.06);
  }

  .planet-label {
    position: absolute;
    bottom: 8px;
    left: 0; right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    z-index: 3;
    pointer-events: none;
  }

  @media (max-width: 600px) {
    .planets-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>

<div class="planets-row">
  <div class="planet-wrap">
    <div class="stars"></div>
    <div class="glow-ring"></div>
    <canvas class="planet-canvas" id="canvas1"></canvas>
    <div class="planet-label">Planet 1</div>
  </div>
  <div class="planet-wrap">
    <div class="stars"></div>
    <div class="glow-ring"></div>
    <canvas class="planet-canvas" id="canvas2"></canvas>
    <div class="planet-label">Planet 2</div>
  </div>
  <div class="planet-wrap">
    <div class="stars"></div>
    <div class="glow-ring"></div>
    <canvas class="planet-canvas" id="canvas3"></canvas>
    <div class="planet-label">Planet 3</div>
  </div>
  <div class="planet-wrap">
    <div class="stars"></div>
    <div class="glow-ring"></div>
    <canvas class="planet-canvas" id="canvas4"></canvas>
    <div class="planet-label">Planet 4</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {

  // ── SWAP THESE OUT WHEN READY ────────────────────────────────
  var MODELS = [
    "https://raw.githubusercontent.com/seanenterp-afk/my-3d-model/main/Untitled.glb",
    "https://raw.githubusercontent.com/seanenterp-afk/my-3d-model/main/Untitled.glb",
    "https://raw.githubusercontent.com/seanenterp-afk/my-3d-model/main/Untitled.glb",
    "https://raw.githubusercontent.com/seanenterp-afk/my-3d-model/main/Untitled.glb"
  ];

  var TEXTURES = [
    "", // texture 1 URL here
    "", // texture 2 URL here
    "", // texture 3 URL here
    ""  // texture 4 URL here
  ];
  // ────────────────────────────────────────────────────────────

  function waitFor(condition, callback) {
    if (condition()) { callback(); return; }
    var t = setInterval(function() {
      if (condition()) { clearInterval(t); callback(); }
    }, 50);
  }

  function initPlanet(canvasId, modelUrl, textureUrl) {
    var canvas   = document.getElementById(canvasId);
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputEncoding = THREE.sRGBEncoding;

    var scene  = new THREE.Scene();

    // Zoomed in — camera much closer
    var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    camera.position.z = 1.6;

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    var dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);
    var fillLight = new THREE.DirectionalLight(0xaad4ff, 0.6);
    fillLight.position.set(-5, -3, -5);
    scene.add(fillLight);

    var model      = null;
    var autoRotate = true;
    var isDragging = false;
    var prevX = 0, prevY = 0, idleTimer;

    function resizeRenderer() {
      var w = canvas.clientWidth;
      var h = canvas.clientHeight;
      if (w === 0 || h === 0) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (autoRotate && model) model.rotation.y += 0.004;
      resizeRenderer();
      renderer.render(scene, camera);
    }
    animate();

    function applyTexture(url) {
      if (!url) return;
      var loader = new THREE.TextureLoader();
      loader.load(url, function(tex) {
        tex.encoding = THREE.sRGBEncoding;
        tex.wrapS    = THREE.RepeatWrapping;
        tex.wrapT    = THREE.RepeatWrapping;
        model.traverse(function(child) {
          if (child.isMesh) {
            child.material.map = tex;
            child.material.color.set(0xffffff);
            child.material.needsUpdate = true;
          }
        });
      });
    }

    function loadModel() {
      var loader = new THREE.GLTFLoader();
      loader.load(modelUrl, function(gltf) {
        model = gltf.scene;
        var box    = new THREE.Box3().setFromObject(model);
        var center = box.getCenter(new THREE.Vector3());
        var size   = box.getSize(new THREE.Vector3());
        var maxDim = Math.max(size.x, size.y, size.z);
        model.position.sub(center);
        model.scale.setScalar(1.8 / maxDim);
        scene.add(model);
        if (textureUrl) applyTexture(textureUrl);
      }, undefined, function(err) { console.error(err); });
    }

    waitFor(
      function() { return window.THREE && THREE.GLTFLoader; },
      loadModel
    );

    // Drag to rotate
    canvas.addEventListener("mousedown", function(e) {
      isDragging = true; autoRotate = false;
      prevX = e.clientX; prevY = e.clientY;
    });

    window.addEventListener("mousemove", function(e) {
      if (!isDragging || !model) return;
      model.rotation.y += (e.clientX - prevX) * 0.01;
      model.rotation.x += (e.clientY - prevY) * 0.01;
      prevX = e.clientX; prevY = e.clientY;
    });

    window.addEventListener("mouseup", function() {
      if (!isDragging) return;
      isDragging = false;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function() { autoRotate = true; }, 2000);
    });

    canvas.addEventListener("touchstart", function(e) {
      isDragging = true; autoRotate = false;
      prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener("touchmove", function(e) {
      if (!isDragging || !model) return;
      model.rotation.y += (e.touches[0].clientX - prevX) * 0.01;
      model.rotation.x += (e.touches[0].clientY - prevY) * 0.01;
      prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener("touchend", function() { isDragging = false; });
  }

  // Inject GLTFLoader once then init all 4
  var script = document.createElement("script");
  script.src = "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js";
  script.onload = function() {
    initPlanet("canvas1", MODELS[0], TEXTURES[0]);
    initPlanet("canvas2", MODELS[1], TEXTURES[1]);
    initPlanet("canvas3", MODELS[2], TEXTURES[2]);
    initPlanet("canvas4", MODELS[3], TEXTURES[3]);
  };
  document.head.appendChild(script);

})();
</script>
