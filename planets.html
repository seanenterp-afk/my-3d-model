<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Planets</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #mainCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: none;
    }

    #cursor {
      position: fixed;
      width: 8px;
      height: 8px;
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      transform: translate(-50%, -50%);
      transition: transform 0.12s, background 0.15s;
      mix-blend-mode: difference;
    }

    #cursor.hovering {
      transform: translate(-50%, -50%) scale(3);
      background: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>

<div id="cursor"></div>
<canvas id="bg"></canvas>
<canvas id="mainCanvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {

  // ── PASTE YOUR URLS HERE ─────────────────────────────────────
  var MODELS = [
    "https://raw.githubusercontent.com/seanenterp-afk/my-3d-model/main/Untitled.glb",
    "https://raw.githubusercontent.com/seanenterp-afk/my-3d-model/main/Untitled.glb",
    "https://raw.githubusercontent.com/seanenterp-afk/my-3d-model/main/Untitled.glb",
    "https://raw.githubusercontent.com/seanenterp-afk/my-3d-model/main/Untitled.glb"
  ];

  var TEXTURES = [ "", "", "", "" ];

  // Bigger scale
  var SCALE = 1.0;
  // ────────────────────────────────────────────────────────────

  // ── Star background ──────────────────────────────────────────
  var bgCanvas = document.getElementById("bg");
  var bgCtx    = bgCanvas.getContext("2d");
  var stars    = [];

  function resizeBg() {
    bgCanvas.width  = window.innerWidth;
    bgCanvas.height = window.innerHeight;
  }

  function makeStars() {
    stars = [];
    for (var i = 0; i < 220; i++) {
      var size = Math.random();
      stars.push({
        x:     Math.random() * bgCanvas.width,
        y:     Math.random() * bgCanvas.height,
        r:     size * 1.4 + 0.2,
        glowR: size * 10 + 4,
        baseO: Math.random() * 0.05 + 0.02,
        peakO: Math.random() * 0.5 + 0.5,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 1.5 + 0.8,
        color: Math.random() > 0.7
                 ? (Math.random() > 0.5 ? "180,210,255" : "255,220,180")
                 : "255,255,255"
      });
    }
  }

  var bgTime = 0;
  function drawBg() {
    bgTime += 0.016;
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

    var grad = bgCtx.createRadialGradient(
      bgCanvas.width * 0.5, bgCanvas.height * 0.5, 0,
      bgCanvas.width * 0.5, bgCanvas.height * 0.5, bgCanvas.width * 0.8
    );
    grad.addColorStop(0,   "#0d1b2a");
    grad.addColorStop(0.5, "#060d16");
    grad.addColorStop(1,   "#000005");
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

    for (var i = 0; i < stars.length; i++) {
      var s        = stars[i];
      var t        = 0.5 + 0.5 * Math.sin(bgTime * s.speed + s.phase);
      var opacity  = s.baseO + (s.peakO - s.baseO) * t;
      var glowOp   = opacity * 0.2;
      var glowSize = s.glowR * (0.8 + 0.5 * t);

      var glow = bgCtx.createRadialGradient(s.x, s.y, 0, s.x, s.y, glowSize);
      glow.addColorStop(0,   "rgba(" + s.color + "," + glowOp + ")");
      glow.addColorStop(0.5, "rgba(" + s.color + "," + (glowOp * 0.4) + ")");
      glow.addColorStop(1,   "rgba(" + s.color + ",0)");
      bgCtx.beginPath();
      bgCtx.arc(s.x, s.y, glowSize, 0, Math.PI * 2);
      bgCtx.fillStyle = glow;
      bgCtx.fill();

      bgCtx.beginPath();
      bgCtx.arc(s.x, s.y, s.r * (0.7 + 0.3 * t), 0, Math.PI * 2);
      bgCtx.fillStyle = "rgba(" + s.color + "," + opacity + ")";
      bgCtx.fill();
    }

    requestAnimationFrame(drawBg);
  }

  resizeBg();
  makeStars();
  drawBg();
  window.addEventListener("resize", function() { resizeBg(); makeStars(); updatePositions(); });

  // ── Cursor ───────────────────────────────────────────────────
  var cursorEl = document.getElementById("cursor");
  var mouseX   = window.innerWidth  / 2;
  var mouseY   = window.innerHeight / 2;
  var mouseNDC = new THREE.Vector2(0, 0);

  window.addEventListener("mousemove", function(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursorEl.style.left = mouseX + "px";
    cursorEl.style.top  = mouseY + "px";
    mouseNDC.x =  (mouseX / window.innerWidth)  * 2 - 1;
    mouseNDC.y = -((mouseY / window.innerHeight) * 2 - 1);
  });

  // ── Renderer ─────────────────────────────────────────────────
  var mainCanvas = document.getElementById("mainCanvas");
  var renderer   = new THREE.WebGLRenderer({ canvas: mainCanvas, antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.outputEncoding = THREE.sRGBEncoding;

  var scene  = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.z = 6.2;

  function resizeRenderer() {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  resizeRenderer();
  window.addEventListener("resize", resizeRenderer);

  // ── Compute positions — tighter spacing ──────────────────────
  function getVisibleWidth() {
    var fovRad = 30 * Math.PI / 180;
    var halfH  = Math.tan(fovRad / 2) * 6.2;
    var aspect = window.innerWidth / window.innerHeight;
    return halfH * aspect * 2;
  }

  var positionsX = [0, 0, 0, 0];

  function updatePositions() {
    var vw      = getVisibleWidth();
    // Reduced padding from 8% to 3% — planets closer to edges
    var padding = vw * 0.03;
    var usable  = vw - padding * 2;
    // Tighter gap — multiply step by 0.75 to bunch planets closer
    var step    = (usable / 3) * 0.75;
    var startX  = -(step * 1.5);
    for (var i = 0; i < 4; i++) {
      positionsX[i] = startX + step * i;
      if (planets[i]) planets[i].posX = positionsX[i];
    }
  }

  // ── Lighting ─────────────────────────────────────────────────
  var key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(-3, 4, 6);
  scene.add(key);

  var fill = new THREE.DirectionalLight(0xaaccff, 0.25);
  fill.position.set(5, 0, 4);
  scene.add(fill);

  var rim = new THREE.DirectionalLight(0x223355, 0.35);
  rim.position.set(0, -3, -5);
  scene.add(rim);

  scene.add(new THREE.AmbientLight(0x0a0f1a, 0.6));

  // ── Planets ──────────────────────────────────────────────────
  var planets   = [];
  var raycaster = new THREE.Raycaster();

  function lerp(a, b, t) { return a + (b - a) * t; }

  function createPlanet(index, modelUrl, textureUrl) {
    var p = {
      model:       null,
      spinY:       0,
      dragOffsetY: 0,
      dragOffsetX: 0,
      attractX:    0,
      attractY:    0,
      isDragging:  false,
      bobPhase:    index * (Math.PI / 2),
      posX:        positionsX[index]
    };

    var loader = new THREE.GLTFLoader();
    loader.load(modelUrl, function(gltf) {
      p.model = gltf.scene;

      var box    = new THREE.Box3().setFromObject(p.model);
      var center = box.getCenter(new THREE.Vector3());
      var size   = box.getSize(new THREE.Vector3());
      var maxDim = Math.max(size.x, size.y, size.z);
      p.model.position.sub(center);
      p.model.scale.setScalar(SCALE / maxDim);
      p.model.position.x = p.posX;

      p.model.traverse(function(child) {
        if (!child.isMesh || !child.material) return;
        child.material.roughness = 0.85;
        child.material.metalness = 0.05;
      });

      scene.add(p.model);
      if (textureUrl) applyTexture(p, textureUrl);
    }, undefined, function(err) { console.error(err); });

    planets.push(p);
  }

  function applyTexture(p, url) {
    new THREE.TextureLoader().load(url, function(tex) {
      tex.encoding = THREE.sRGBEncoding;
      p.model.traverse(function(child) {
        if (child.isMesh && child.material) {
          child.material.map         = tex;
          child.material.needsUpdate = true;
        }
      });
    });
  }

  // ── Animation ────────────────────────────────────────────────
  var clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    var t        = clock.getElapsedTime();
    var anyHover = false;

    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      if (!p.model) continue;

      p.spinY += 0.003;

      if (!p.isDragging) {
        p.dragOffsetX = lerp(p.dragOffsetX, 0, 0.018);
        p.dragOffsetY = lerp(p.dragOffsetY, 0, 0.008);

        var wp = new THREE.Vector3(p.posX + p.attractX, p.attractY, 0);
        wp.project(camera);

        var dx   = mouseNDC.x - wp.x;
        var dy   = mouseNDC.y - wp.y;
        var dist = Math.sqrt(dx * dx + dy * dy);

        var pullRadius = 0.5;
        if (dist < pullRadius) {
          anyHover     = true;
          var strength = Math.pow((pullRadius - dist) / pullRadius, 1.5);
          p.attractX   = lerp(p.attractX, dx * strength * 0.45, 0.05);
          p.attractY   = lerp(p.attractY, dy * strength * 0.45, 0.05);
        } else {
          p.attractX = lerp(p.attractX, 0, 0.04);
          p.attractY = lerp(p.attractY, 0, 0.04);
        }
      } else {
        p.attractX = lerp(p.attractX, 0, 0.12);
        p.attractY = lerp(p.attractY, 0, 0.12);
      }

      p.model.position.x = p.posX + p.attractX;
      p.model.position.y = Math.sin(t * 0.6 + p.bobPhase) * 0.05 + p.attractY;
      p.model.rotation.y = p.spinY + p.dragOffsetY;
      p.model.rotation.x = p.dragOffsetX;
    }

    cursorEl.classList.toggle("hovering", anyHover);
    renderer.render(scene, camera);
  }
  animate();

  // ── Drag ─────────────────────────────────────────────────────
  var dragPlanet = null;
  var prevX = 0, prevY = 0;

  mainCanvas.addEventListener("mousedown", function(e) {
    raycaster.setFromCamera(mouseNDC, camera);
    var bestDist = Infinity;
    dragPlanet   = null;
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      if (!p.model) continue;
      var hits = raycaster.intersectObject(p.model, true);
      if (hits.length > 0 && hits[0].distance < bestDist) {
        bestDist   = hits[0].distance;
        dragPlanet = p;
      }
    }
    if (dragPlanet) {
      dragPlanet.isDragging  = true;
      dragPlanet.dragOffsetY = dragPlanet.model.rotation.y - dragPlanet.spinY;
      dragPlanet.dragOffsetX = dragPlanet.model.rotation.x;
    }
    prevX = e.clientX;
    prevY = e.clientY;
  });

  window.addEventListener("mousemove", function(e) {
    if (!dragPlanet) return;
    dragPlanet.dragOffsetY += (e.clientX - prevX) * 0.012;
    dragPlanet.dragOffsetX += (e.clientY - prevY) * 0.012;
    prevX = e.clientX;
    prevY = e.clientY;
  });

  window.addEventListener("mouseup", function() {
    if (dragPlanet) { dragPlanet.isDragging = false; dragPlanet = null; }
  });

  mainCanvas.addEventListener("touchstart", function(e) {
    var touch = e.touches[0];
    mouseNDC.x =  (touch.clientX / window.innerWidth)  * 2 - 1;
    mouseNDC.y = -((touch.clientY / window.innerHeight) * 2 - 1);
    raycaster.setFromCamera(mouseNDC, camera);
    var bestDist = Infinity;
    dragPlanet   = null;
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      if (!p.model) continue;
      var hits = raycaster.intersectObject(p.model, true);
      if (hits.length > 0 && hits[0].distance < bestDist) {
        bestDist   = hits[0].distance;
        dragPlanet = p;
      }
    }
    if (dragPlanet) {
      dragPlanet.isDragging  = true;
      dragPlanet.dragOffsetY = dragPlanet.model.rotation.y - dragPlanet.spinY;
      dragPlanet.dragOffsetX = dragPlanet.model.rotation.x;
    }
    prevX = touch.clientX;
    prevY = touch.clientY;
  }, { passive: true });

  mainCanvas.addEventListener("touchmove", function(e) {
    if (!dragPlanet) return;
    var touch = e.touches[0];
    dragPlanet.dragOffsetY += (touch.clientX - prevX) * 0.012;
    dragPlanet.dragOffsetX += (touch.clientY - prevY) * 0.012;
    prevX = touch.clientX;
    prevY = touch.clientY;
  }, { passive: true });

  mainCanvas.addEventListener("touchend", function() {
    if (dragPlanet) { dragPlanet.isDragging = false; dragPlanet = null; }
  });

  // ── Load ─────────────────────────────────────────────────────
  var script = document.createElement("script");
  script.src = "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js";
  script.onload = function() {
    updatePositions();
    for (var i = 0; i < MODELS.length; i++) {
      createPlanet(i, MODELS[i], TEXTURES[i]);
    }
  };
  document.head.appendChild(script);

})();
</script>
</body>
</html>
